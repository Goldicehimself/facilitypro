<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/facilitypro-wrench.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('mp_theme');
          const theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (_) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <meta
      name="description"
      content="FacilityPro is an all-in-one facility maintenance management platform for work orders, assets, vendors, and analytics."
    />
    <meta property="og:title" content="FacilityPro - Facility Management System" />
    <meta
      property="og:description"
      content="Manage facilities smarter with work orders, preventive maintenance, vendor tracking, and real-time dashboards."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/facilitypro-wrench.svg" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    />
    <title>FacilityPro - Facility Management System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
